<div class="form-page">
    <app-navbar></app-navbar>
    <main class="form-content">
        <div class="container d-flex justify-content-center py-4">

            <div class="card shadow-lg border-0 w-100" style="max-width:700px; border-radius:15px;">

                <!-- Header -->
                <div class="card-header text-center text-white py-3"
                    style="background:linear-gradient(135deg,#0d6efd,#0a58ca);">

                    <h3 class="fw-bold mb-0">
                        My Profile
                    </h3>

                </div>

                <!-- Body -->
                <div class="card-body p-4">

                    <!-- Message -->
                    <div *ngIf="!form.error && form.message"
                        class="alert alert-success alert-dismissible fade show position-relative">

                        {{ form.message }}

                        <button type="button" class="close" (click)="form.message = ''"
                            style="position:absolute; right:15px; top:8px; border:none; background:transparent; font-size:24px;">
                            &times;
                        </button>

                    </div>

                    <div *ngIf="form.error && form.message"
                        class="alert alert-danger alert-dismissible fade show position-relative">

                        {{ form.message }}

                        <button type="button" class="close" (click)="form.message = ''"
                            style="position:absolute; right:15px; top:8px; border:none; background:transparent; font-size:24px;">
                            &times;
                        </button>

                    </div>
                    <div class="d-flex align-items-center justify-content-center gap-4 mb-4">

                        <!-- Profile Image Left -->
                        <img *ngIf="form.data.imageId" [src]="'http://localhost:8080/User/profilePic/' + form.data.id"
                            (error)="setDefaultImage($event)" class="img-thumbnail rounded-circle" width="120"
                            height="120" style="width: 1.5cm; height: 1.5cm; object-fit: cover;" alt="Profile Photo">

                        <!-- Choose File Right -->
                        <div>
                            <label class="form-label fw-semibold">
                                Change Profile Photo
                            </label>

                            <input type="file" class="form-control" accept="image/*" style="max-width:300px;">
                        </div>

                    </div>
                    <div class="row">

                        <!-- First Name -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">
                                First Name <span class="text-danger">*</span>
                            </label>

                            <input type="text" class="form-control" name="firstName" [(ngModel)]="form.data.firstName"
                                placeholder="Enter First Name">

                            <small class="text-danger">
                                {{form.inputerror.firstName}}
                            </small>
                        </div>

                        <!-- Last Name -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">
                                Last Name <span class="text-danger">*</span>
                            </label>

                            <input type="text" class="form-control" name="lastName" [(ngModel)]="form.data.lastName"
                                placeholder="Enter Last Name">

                            <small class="text-danger">
                                {{form.inputerror.lastName}}
                            </small>
                        </div>

                        <!-- Login ID -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">
                                Login ID <span class="text-danger">*</span>
                            </label>

                            <input type="text" class="form-control" name="loginId" [(ngModel)]="form.data.loginId"
                                readonly placeholder="Enter loginId">

                            <small class="text-danger">
                                {{form.inputerror.loginId}}
                            </small>
                        </div>
                        <!-- Password -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">
                                Password <span class="text-danger">*</span>
                            </label>

                            <input type="text" class="form-control" name="password" [(ngModel)]="form.data.password"
                                readonly placeholder="Enter Password">

                            <small class="text-danger">
                                {{form.inputerror.password}}
                            </small>
                        </div>



                        <!-- DOB -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">
                                Date of Birth <span class="text-danger">*</span>
                            </label>

                            <input type="date" class="form-control" name="dob" [(ngModel)]="form.data.dob"
                                [max]="maxDOB">

                            <small class="text-danger">
                                {{form.inputerror.dob}}
                            </small>
                        </div>

                        <!-- Gender -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">
                                Gender <span class="text-danger">*</span>
                            </label>

                            <select class="form-select" name="gender" [(ngModel)]="form.data.gender">

                                <option value="undefined">------------Select------------</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>

                            <small class="text-danger">
                                {{form.inputerror.gender}}
                            </small>
                        </div>

                        <!-- Phone and Alternate Mobile -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Phone No.</label>
                            <input type="text" class="form-control" [(ngModel)]="form.data.phone" name="phone"
                                maxlength="10" placeholder="Enter Phone Number">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Alternate Mobile No.</label>
                            <input type="text" class="form-control" [(ngModel)]="form.data.alternateMobile"
                                name="alternateMob" maxlength="10" placeholder="Enter Alternate Mobile">
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex flex-column flex-md-row justify-content-center gap-3 mt-3">

                            <button class="btn btn-primary px-4" (click)="myProfile()">
                                Save
                            </button>

                            <button class="btn btn-secondary px-4" (click)="forward('/userList')">
                                Back to List
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>
    </main>
    <app-footer></app-footer>
</div>
