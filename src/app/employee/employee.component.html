<app-navbar></app-navbar>

<div align="center">
    <h1 *ngIf="!form.data.id" align="center" style="margin-bottom: 5px; color: navy">Add Employee</h1>
    <h1 *ngIf="form.data.id>0" align="center" style="margin-bottom: 5px; color: navy">Update Employee</h1>

    <div style="height: 20px; margin-bottom: 10px; text-align: center;">
        <h3 style="margin: 0; color: green;" *ngIf="!form.error && form.message">{{ form.message }}</h3>
        <h3 style="margin: 0; color: red;" *ngIf="form.error && form.message">{{ form.message }}</h3>
    </div>

     <table>
        <tr>
            <th align="left">Name<span style="color: red">*</span></th>
            <td align="center"><input type="text" name="name" [(ngModel)]="form.data.name" placeholder="Enter Employee Name"></td>
            <td style="position: fixed; color: red;">{{form.inputerror.name}}</td>
        </tr>

             <tr>
            <th align="left">Department<span style="color: red">*</span></th>
            <td align="center"><input type="text" name="department" [(ngModel)]="form.data.department" placeholder="Enter Department"></td>
            <td style="position: fixed; color: red;">{{form.inputerror.department}}</td>
        </tr>
 <tr>
            <th align="left">Salary<span style="color: red">*</span></th>
            <td align="center"><input type="number" name="salary" [(ngModel)]="form.data.salary" placeholder="Enter Salary"></td>
            <td style="position: fixed; color: red;">{{form.inputerror.salary}}</td>
        </tr>
 <tr>
            <th align="left">Joining Date<span style="color: red">*</span></th>
            <td align="center"><input type="date" name="joiningDate" [(ngModel)]="form.data.joiningDate" ></td>
            <td style="position: fixed; color: red;">{{form.inputerror.joiningDate}}</td>
        </tr>
        

        <tr></tr>

        <tr>
            <th></th>
            <td align="left" colspan="2">
                <button (click)="submit()">save</button> &nbsp;
                <button (click)="forward('/employeelist')">list</button>
            </td>
        </tr>
    </table>
</div>

<app-footer></app-footer>
